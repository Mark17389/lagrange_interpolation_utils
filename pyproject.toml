[project]
name = "lagrange-interpolation-utils"
version = "0.1.1"
description = "Builds and evaluates the Lagrange interpolating polynomial using only the Python stdlib."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
